worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 256;

    # ---- logging -----------------------------------------------------------
    #
    # The only question these logs answer is how many people are interested and
    # roughly where from. That does not require knowing who any of them are, so
    # a whole address is never written to disk.
    #
    # Requests arrive via cloudflared, so $remote_addr is a docker-network
    # address and worthless anyway. The real client address is in
    # CF-Connecting-IP and gets truncated before it is written: IPv4 to its
    # /24, IPv6 to its /48.

    map $http_cf_connecting_ip $client_prefix {
        default                                            "unknown";
        "~^(?<a>\d+)\.(?<b>\d+)\.(?<c>\d+)\.\d+$"          "$a.$b.$c.0";
        "~^(?<g>[0-9a-fA-F]+:[0-9a-fA-F]*:[0-9a-fA-F]*):"  "$g::";
    }

    # A request with no CF-Connecting-IP never went through cloudflared, so it
    # is ours — the deploy script curling nginx to check it is serving. Without
    # this the numbers drift upward on their own.
    map $http_cf_connecting_ip $loggable {
        ""      0;
        default 1;
    }

    # Query strings are dropped: campaign tags and referrer junk live there and
    # none of it is worth keeping. $server_protocol already reads "HTTP/1.1" —
    # do not prefix it again.
    log_format privacy '$client_prefix - - [$time_local] "$request_method $uri '
                       '$server_protocol" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" "$http_cf_ipcountry"';

    # NOT access.log: the nginx image ships /var/log/nginx/access.log as a
    # symlink to /dev/stdout, and a volume mounted over that directory inherits
    # the symlink. Writing there writes to the container's stdout, leaving the
    # file on disk permanently empty. A distinct name avoids it.
    access_log /var/log/nginx/untofu-access.log privacy if=$loggable;
    error_log  /var/log/nginx/untofu-error.log warn;

    # ---- site --------------------------------------------------------------

    # The page is one file and changes whenever it is redeployed; the artwork
    # effectively never does.
    map $uri $cache_control {
        default                      "no-cache";
        "~\.(svg|png|jpg|ico)$"      "public, max-age=86400";
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # The page is self-contained: no scripts, no external anything. The
        # policy says so, so a browser enforces it even if that ever slips.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
        # Host-only, never includeSubDomains: unaffiliated third-party
        # subdomains live under elusive.net. Same constraint as the apex site.
        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
